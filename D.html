<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soft Cute Music Page 🧸</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to top, #ffd6e7, #ffeef5, #fff8fb);
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ✨ Floating background hearts */
.hearts {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.heart {
  position: absolute;
  color: rgba(255,255,255,0.5);
  font-size: 20px;
  animation: float 8s linear infinite;
}

@keyframes float {
  from {
    transform: translateY(100vh);
    opacity: 0;
  }
  to {
    transform: translateY(-10vh);
    opacity: 1;
  }
}

/* 🌸 Main Card */
.container {
  position: relative;
  z-index: 2;
  width: 90%;
  max-width: 420px;
  background: rgba(255,255,255,0.3);
  backdrop-filter: blur(12px);
  border-radius: 25px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

/* 🧸 Teddy + Panda */
.cute {
  font-size: 65px;
  margin-bottom: 15px;
  animation: bounce 2s infinite;
}

@keyframes bounce {
  50% {
    transform: translateY(-8px);
  }
}

/* ✨ Small text */
.text {
  color: #5c5470;
  font-size: 18px;
  margin-top: 10px;
  font-weight: 500;
}

/* 💌 Message */
.message {
  margin-top: 20px;
  color: #6b5b73;
  font-size: 15px;
  line-height: 1.7;
  background: rgba(255,255,255,0.45);
  padding: 15px;
  border-radius: 18px;
}

/* 🎵 Spotify Embed */
iframe {
  border-radius: 20px;
  width: 100%;
  height: 152px;
  border: none;
  margin-top: 18px;
}
</style>
</head>

<body>

<!-- ✨ Hearts -->
<div class="hearts" id="hearts"></div>

<!-- 🌸 Main Content -->
<div class="container">

<div class="cute">🧸 🐼 🦋</div>

<div class="text">
Just listen & smile 🎶
</div>

<!-- 🎵 Spotify Song -->
<iframe 
src="https://open.spotify.com/embed/track/2cPUB8EOT6AfJ8oxhyoNXL?utm_source=generator" 
allowfullscreen="" 
allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
</iframe>

<!-- 💌 Message -->
<div class="message">
You will recieve an another Msg at 12:00 am on May 20. <br><br>
I hope it is going to be a special one for u... my frnd ! 💌 <br><br>
Check that in email !
</div>

</div>

<!-- ✨ Floating Hearts Script -->
<script>
const hearts = document.getElementById("hearts");

for(let i = 0; i < 25; i++) {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = ["💖","🦋","✨","🌸"].sort(() => 0.5 - Math.random())[0];
  
  h.style.left = Math.random()*100 + "vw";
  h.style.animationDuration = (5 + Math.random()*5) + "s";
  h.style.fontSize = (15 + Math.random()*20) + "px";
  
  hearts.appendChild(h);
}
</script>

</body>
</html>
